  rfc9457: false
  content_type: application/json
  shape:
    code: Machine-readable string error code.
    message: Human-readable message.
    data.status: HTTP status code, repeated in the body.
    data.params: Per-parameter validation messages (on rest_invalid_param).
    data.details: Nested per-parameter error objects (on rest_invalid_param).
