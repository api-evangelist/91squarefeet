versioning:
  style: namespace-in-path
  current: wp/v2
  detail: >-
    Version is a path namespace (/wp-json/wp/v2/). Other namespaces present on the host — oembed/1.0,
    wp-abilities/v1, mcp, and a set of plugin namespaces — version independently. No provider versioning or
    deprecation policy is published.
request_id_tracing:
  supported: false
  detail: No request-id or correlation header was returned on any observed response.
rate_limit_signaling:
  supported: false
  detail: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header appeared on any observed response, and no limit is
    published. See rate-limits/91squarefeet-rate-limits.yml.
caching:
  detail: >-
    The origin (LiteSpeed on Hostinger) returns `Cache-Control: no-cache, must-revalidate, max-age=0,
    no-store, private` and `X-LiteSpeed-Cache-Control: no-cache` on REST responses. No ETag or Last-Modified
    was returned, so conditional requests are not available.
idempotency:
  coverage: na
  mechanism: none
  scope: []
  detail: >-
    There is no anonymous write surface. Anonymous requests are read-only — the origin answers `Allow: GET` on
    the content collections and returns 401 rest_forbidden on any authenticated namespace. Idempotency is
    therefore not applicable rather than absent-and-failing. WordPress core publishes no Idempotency-Key
    mechanism for the authenticated write surface either.
dry_run_mode:
  supported: na
  detail: No write surface is publicly reachable, so a dry-run mode is not applicable.
reversibility:
  grade: na
  detail: >-
    The publicly reachable surface is read-only (GET only, anonymous). There are no writes to reverse, so
    reversibility is not applicable rather than undocumented. No cancel/refund/void/undo/restore operation
    exists in the described surface, and none is claimed.
  write_surfaces: []
