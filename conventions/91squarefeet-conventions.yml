source: >-
  openapi/91squarefeet-content-api-openapi.yml (itself derived from https://91squarefeet.com/wp-json), plus
  live response headers and error bodies observed on https://91squarefeet.com/wp-json/wp/v2/* on 2026-09-05.
note: >-
  91Squarefeet publishes no API documentation, so nothing here is quoted from the provider. Every convention
  below was OBSERVED on live anonymous responses from its own host, or read from the machine-readable route
  index the site serves. Where a convention does not exist, it is recorded as absent rather than assumed.
authentication:
  style: none-for-read
  detail: >-
    Anonymous requests to the wp/v2 content collections succeed and the origin answers `Allow: GET`. Writes and
    the admin/plugin namespaces require WordPress Application Passwords over HTTP Basic; there is no public
    self-service path to obtain one.
  detail_artifact: authentication/91squarefeet-authentication.yml
pagination:
  style: page-number
  parameters:
  - name: page
    default: 1
    note: 1-indexed page number.
  - name: per_page
    default: 10
    minimum: 1
    maximum: 100
    note: Enforced server-side; per_page=999 returns 400 rest_invalid_param / rest_out_of_bounds.
  - name: offset
    note: Alternative to page; offsets the result set.
  response_fields: []
  response_headers:
  - name: X-WP-Total
    meaning: Total number of records matching the query.
    observed_value: '42'
  - name: X-WP-TotalPages
    meaning: Total number of pages available at the current per_page.
    observed_value: '21'
  - name: Link
    meaning: RFC 8288 link header carrying rel="next" and rel="prev".
    observed_value: '<https://91squarefeet.com/wp-json/wp/v2/portfolio?per_page=2&page=2>; rel="next"'
  cors: >-
    Access-Control-Expose-Headers exposes X-WP-Total, X-WP-TotalPages and Link to browsers, so the pagination
    signal is reachable from a cross-origin agent.
filtering_and_shaping:
  search: '`search` free-text parameter on every collection.'
  field_selection: '`_fields` — a comma-separated list limiting which properties are returned.'
  embedding: '`_embed` — inlines linked resources (author, featured media, terms) under `_embedded`.'
  ordering: '`orderby` + `order` (asc|desc); collection-specific orderby enums are declared per operation.'
  filtering: 'Per-collection `include`, `exclude`, `slug`, `status`, `after`, `before`, `modified_after`, `modified_before`, plus taxonomy filters (`categories`, `tags`) on posts.'
  context: '`context` (view|embed|edit) controls response verbosity; `edit` requires authentication.'
error_envelope:
