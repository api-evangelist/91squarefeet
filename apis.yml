- aid: 91squarefeet:91squarefeet-content-api
  name: 91Squarefeet Content API
  description: >-
    The read-only WordPress REST API (`wp/v2` namespace) that 91squarefeet.com serves by default, including the
    custom content types the company registered for its own business content — portfolio (delivered fit-out
    projects), client, case_study, property, testimonial and press_release — alongside the standard posts,
    pages, media, users, comments, taxonomy and search collections. Every operation described was probed
    anonymously and returned HTTP 200; anonymous requests are read-only (the origin answers `Allow: GET` on
    collections). This is a CMS-exposed content surface, not a documented developer product: 91Squarefeet
    publishes no developer portal, no API reference and no specification of its own, so the OpenAPI here was
    derived mechanically from the route index the site itself serves at https://91squarefeet.com/wp-json.
