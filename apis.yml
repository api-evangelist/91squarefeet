aid: 91squarefeet
name: 91Squarefeet
description: >-
  91Squarefeet is a Gurugram, India based design-and-build company delivering turnkey retail and office
  fit-outs for brands expanding their physical footprint across India. Founded 2018-2019 and backed by Y
  Combinator, Stellaris Venture Partners and Stride Ventures, it runs a full-stack, non-subcontracted model —
  in-house project management, a digitized supply chain spanning fixture factories, material OEMs, engineering
  consultants and labour contractors, and an internal AI-assisted project platform with a field mobile app —
  and reports 1,100+ delivered projects for brands including TATA, DLF, Godrej, Asian Paints, Kotak and
  Bluestone. It publishes no developer program, no API documentation and no OpenAPI. The only
  machine-readable surfaces on its host are the WordPress REST API its public website exposes (serving the
  company's own portfolio, client, case-study, property, testimonial and press-release content anonymously),
  a Rank Math llms.txt, and a gated WordPress MCP adapter endpoint.
