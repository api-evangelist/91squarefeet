apis:
- aid: 91squarefeet:91squarefeet-mcp-adapter
  name: 91Squarefeet MCP Adapter Endpoint
  description: >-
    A Model Context Protocol endpoint present on the 91squarefeet.com host at the WordPress `mcp` REST
    namespace, route `mcp/mcp-adapter-default-server`, declared by the site's own /wp-json route index.
    It is the WordPress MCP Adapter plugin's default server fronting the site's content estate — not a
    documented 91Squarefeet product. It is authentication-gated: an anonymous JSON-RPC `tools/list` returns
    HTTP 401 `rest_forbidden`, so the live tool inventory and per-tool inputSchema cannot be enumerated
    without credentials. The site advertises no OAuth metadata (/.well-known/oauth-authorization-server
    and /.well-known/oauth-protected-resource both 404); the only authentication scheme the discovery
    document declares is WordPress Application Passwords.
  humanURL: https://91squarefeet.com/
  image: https://91squarefeet.com/wp-content/uploads/2024/02/91_400x400.webp
  baseURL: https://91squarefeet.com/wp-json/mcp/mcp-adapter-default-server
  tags:
  - MCP
  - Agents
  - Content
  properties:
  - type: MCPServer
    url: mcp/91squarefeet-mcp.yml
  - type: ToolCrosswalk
    url: mcp/91squarefeet-tool-crosswalk.yml
  x-evidence:
    namespace_index: https://91squarefeet.com/wp-json/mcp
    namespace_index_status: 200
    tools_list_status: 401
    tools_list_response: >-
      {"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}
    oauth_authorization_server_status: 404
    fetched: '2026-09-05'
