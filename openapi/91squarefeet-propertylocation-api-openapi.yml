  /wp/v2/property_location/{id}:
    get:
      operationId: getPropertyLocation
      summary: Retrieve one PropertyLocation record
      description: Retrieve a single PropertyLocation record by its numeric id. Read-only, unauthenticated.
      tags:
      - PropertyLocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Unique identifier for the PropertyLocation record.
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
