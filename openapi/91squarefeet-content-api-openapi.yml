components:
  schemas:
    Post:
      type: object
      description: A Post record as served by the site REST API.
      properties:
        id:
          type: integer
          description: Unique identifier for the record.
        date:
          type: string
          format: date-time
          description: Publication date in the site timezone.
        date_gmt:
          type: string
          format: date-time
          description: Publication date as GMT.
        modified:
          type: string
          format: date-time
          description: Last modification date in the site timezone.
        modified_gmt:
          type: string
          format: date-time
          description: Last modification date as GMT.
        guid:
          type: object
          properties: &id001
            rendered:
              type: string
              description: HTML-rendered value.
          description: Globally unique identifier for the record.
        slug:
          type: string
          description: Alphanumeric identifier unique to its type.
        status:
          type: string
          description: Publication status.
        type:
          type: string
          description: Content type slug.
        link:
          type: string
          format: uri
          description: URL of the record on 91squarefeet.com.
        title:
          type: object
          properties: *id001
          description: Title of the record.
        content:
          type: object
          properties: *id001
          description: Body content of the record.
        excerpt:
          type: object
          properties: *id001
          description: Excerpt of the record.
        featured_media:
          type: integer
